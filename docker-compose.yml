services:
  mcp-server:
    build: .
    image: pm-mcp
    container_name: pm-mcp
    ports:
      - "8000:8000"
    environment:
      - MCP_TRANSPORT=streamable-http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
    restart: unless-stopped
    volumes:
      - ./config.json:/app/config.json
      - .:/app
      - /app/.venv
    # Mỗi user truyền cookie riêng qua header x-tms-cookie
    # Không cần SESSION_COOKIE trong env nữa
